<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#0d1117"/>

  <!-- Left film-reel wing -->
  <circle cx="5.5" cy="18" r="5.5" fill="#10b981"/>
  <circle cx="5.5" cy="18" r="1.9" fill="#0d1117"/>
  <circle cx="5.5" cy="13.8" r="0.9" fill="#0d1117"/>
  <circle cx="8.5" cy="20.5" r="0.9" fill="#0d1117"/>
  <circle cx="2.5" cy="20.5" r="0.9" fill="#0d1117"/>

  <!-- Right film-reel wing -->
  <circle cx="26.5" cy="18" r="5.5" fill="#10b981"/>
  <circle cx="26.5" cy="18" r="1.9" fill="#0d1117"/>
  <circle cx="26.5" cy="13.8" r="0.9" fill="#0d1117"/>
  <circle cx="29.5" cy="20.5" r="0.9" fill="#0d1117"/>
  <circle cx="23.5" cy="20.5" r="0.9" fill="#0d1117"/>

  <!-- Owl body -->
  <ellipse cx="16" cy="27.5" rx="5.5" ry="4.5" fill="#1a1a1a"/>

  <!-- Owl head -->
  <circle cx="16" cy="14.5" r="8" fill="#1a1a1a"/>

  <!-- Ear tufts -->
  <polygon points="11.5,7.5 9.5,3 13.5,9" fill="#1a1a1a"/>
  <polygon points="20.5,7.5 18.5,9 22.5,3" fill="#1a1a1a"/>

  <!-- Left eye (green) -->
  <circle cx="13" cy="13.5" r="3.2" fill="#10b981"/>
  <circle cx="13.3" cy="13.8" r="1.9" fill="#0d1117"/>
  <circle cx="12.3" cy="12.5" r="0.6" fill="white" opacity="0.7"/>

  <!-- Right eye (green) -->
  <circle cx="19" cy="13.5" r="3.2" fill="#10b981"/>
  <circle cx="18.7" cy="13.8" r="1.9" fill="#0d1117"/>
  <circle cx="18" cy="12.5" r="0.6" fill="white" opacity="0.7"/>

  <!-- Beak -->
  <polygon points="16,16.5 14.8,18.5 17.2,18.5" fill="#10b981"/>

  <!-- Feet -->
  <path d="M13.5 31 L12.5 32 M13.5 31 L13.5 32 M13.5 31 L14.5 32" stroke="#10b981" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M18.5 31 L17.5 32 M18.5 31 L18.5 32 M18.5 31 L19.5 32" stroke="#10b981" stroke-width="0.9" stroke-linecap="round"/>
</svg>
